[graph]
exclude-unpublished = true

[advisories]
unmaintained = "none"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
highlight = "all"
skip = [
    # Tungstenite's test client uses the newer crypto stack; headers and cookie
    # still require the older versions. Keep these exceptions version-specific.
    { name = "sha1", version = "0.11" },
    { name = "digest", version = "0.11" },
    { name = "block-buffer", version = "0.12" },
    { name = "crypto-common", version = "0.2" },
]
skip-tree = [
    # parking_lot pulls in old versions of windows-sys
    { name = "windows-sys" },
    # pulled in by quickcheck and cookie
    { name = "rand" },
    # duplicate dependency is intended, see axum-extra/Cargo.lock
    { name = "serde_html_form" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
